<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/style.css">
    <title>Asset Management</title>
</head>
<body>
    <div class="header" id="header"></div>

    <!-- Flexible Grid Section -->
    <div class="grid-container">
        <div class="grid-box">
            <h3>Laptop</h3>
            <p>Total assets: 1,245</p> <!-- Dummy data, replace with actual data from the database -->
        </div>
        <div class="grid-box">
            <h3>Printer</h3>
            <p>Total assets: 842</p> <!-- Dummy data, replace with actual data from the database -->
        </div>
        <div class="grid-box">
            <img src="/public/assets/icons/plus.svg" alt="Add Asset" width="50">
            <p>Add New Asset</p>
        </div>
    </div>

    <div class="footer" id="footer"></div>

    <script>
    fetch("./partials/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      
        initMobileMenu();
      });

    fetch("./partials/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
      </script>

    <script src="/public/js/app.js"></script>
    <script src="/server.js"></script>
</body>
</html>
