<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/style.css">
    <title>Asset Management - Category</title>
</head>
<body>
    <div class="header" id="header"></div>

    <div class="category-container">
        <h2><u id="categoryHeading">Category Name</u></h2>
        
        <table>
            <thead>
                <!-- Dynamically populated via app.js depending on category fields -->
            </thead>
            <tbody id="categoryTableBody">
                <!-- Dynamically populated via app.js -->
            </tbody>
        </table>
    </div>

    <div class="footer" id="footer"></div>

    <script>
    fetch("./partials/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
        
        if (typeof initMobileMenu === 'function') {
            initMobileMenu();
        }
        
        // ---> TRIGGER DROPDOWN POPULATION HERE <---
        if (typeof window.loadCategoryDropdown === 'function') {
            window.loadCategoryDropdown();
        }
      });

    fetch("./partials/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
    </script>

    <script src="/public/js/app.js"></script>
</body>
</html>
