<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/public/css/style.css">
    <title>Profile</title>
</head>
<body>
    <div class="header" id="header"></div>

    <div class="profile-container">
        <h2>User Profile</h2>
        <div class="profile-details">
            <p><strong><img src="/public/assets/icons/user-icon.svg" alt="User Icon"></strong></p>
            <p><strong>Name:</strong> <span id="name">John Doe</span></p>
            <p><strong>Username:</strong> <span id="username">JohnDoe</span></p>
            <p><strong>Email:</strong> <span id="email">johndoe@example.com</span></p>
            <p><strong>Role:</strong> <span id="role">Administrator</span></p>
            <p><strong>Joined:</strong> <span id="joinedDate">January 1, 2020</span></p>
            <button id="editProfileBtn">Edit Profile</button>
        </div>
    </div>

    <div class="footer" id="footer"></div>

    <script>
    fetch("./partials/header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
        
        if (typeof initMobileMenu === 'function') {
            initMobileMenu();
        }
        
        // ---> TRIGGER DROPDOWN POPULATION HERE <---
        if (typeof window.loadCategoryDropdown === 'function') {
            window.loadCategoryDropdown();
        }
      });

    fetch("./partials/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });
    </script>

    <script src="/public/js/app.js"></script>
</body>
</html>
